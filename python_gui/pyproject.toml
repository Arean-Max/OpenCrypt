[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-crypt"
version = "0.2.0"
description = "File encryption/decryption tool with Windows context menu"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.5",
]

[tool.setuptools.packages.find]
where = ["src"]
